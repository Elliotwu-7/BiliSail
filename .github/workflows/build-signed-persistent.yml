name: Build signed Android x86_64 APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本 x.y.z+N'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            **/pubspec.lock
            .flutter-version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          architecture: x64
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Set up Android NDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build signed x86_64 release APK
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
          ANDROID_PREVIEW_SIGNING: 'false'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERTIFICATE_SHA256: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
        run: ./tool/build-release.ps1 -Target android-x86_64 -Version $env:BUILD_VERSION -AndroidPreviewSigning:$false
      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: BiliSail-android-x86_64-signed-persistent
          path: artifacts/android-x86_64/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
