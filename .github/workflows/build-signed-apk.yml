name: Build signed Android x86_64 APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本 x.y.z+N'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            **/pubspec.lock
            .flutter-version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          architecture: x64
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Set up Android NDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Create ephemeral release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/bilisail-release.jks"
          store_password="$(openssl rand -hex 24)"
          key_password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -keystore "$keystore" \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias bilisail-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BiliSail Release, OU=BiliSail, O=BiliSail, L=Unknown, ST=Unknown, C=US"
          certificate_sha256="$(keytool -exportcert -rfc -keystore "$keystore" -storepass "$store_password" -alias bilisail-release | openssl x509 -outform DER | openssl dgst -sha256 -r | awk '{print $1}')"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$store_password"
            echo "ANDROID_KEY_ALIAS=bilisail-release"
            echo "ANDROID_KEY_PASSWORD=$key_password"
            echo "ANDROID_SIGNING_CERTIFICATE_SHA256=$certificate_sha256"
          } >> "$GITHUB_ENV"
      - name: Build signed x86_64 release APK
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
          ANDROID_PREVIEW_SIGNING: 'false'
        run: ./tool/build-release.ps1 -Target android-x86_64 -Version $env:BUILD_VERSION -AndroidPreviewSigning:$false
      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: BiliSail-android-x86_64-signed
          path: artifacts/android-x86_64/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
